<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>b1-1 Linux 운영 미션 수행 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
    }
    body {
      min-height: 100vh;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif;
    }
    .frame { width: min(1120px, 100%); margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font: 500 12px/1.4 'Geist Mono', monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      font: 400 clamp(28px, 4vw, 40px)/1.15 'Instrument Serif', 'Noto Serif KR', serif;
      letter-spacing: -.02em;
    }
    .subtitle { max-width: 760px; margin-bottom: 32px; color: var(--muted); line-height: 1.7; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(45,49,66,.12);
    }
    .zoom-toggle {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .toolbar label {
      min-width: 40px;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid rgba(45,49,66,.24);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: 600 14px/1 'Geist', 'Noto Sans KR', sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .toolbar label:hover { border-color: var(--accent); color: var(--accent); }
    .zoom-help { margin-left: auto; color: var(--soft); font-size: 12px; }
    .diagram { overflow-x: auto; padding-bottom: 8px; }
    svg { display: block; width: 100%; min-width: 840px; height: auto; }
    #zoom-75:checked ~ .diagram svg { width: 75%; }
    #zoom-100:checked ~ .diagram svg { width: 100%; }
    #zoom-125:checked ~ .diagram svg { width: 125%; max-width: none; }
    #zoom-150:checked ~ .diagram svg { width: 150%; max-width: none; }
    #zoom-200:checked ~ .diagram svg { width: 200%; max-width: none; }
    #zoom-75:checked ~ .toolbar label[for="zoom-75"],
    #zoom-100:checked ~ .toolbar label[for="zoom-100"],
    #zoom-125:checked ~ .toolbar label[for="zoom-125"],
    #zoom-150:checked ~ .toolbar label[for="zoom-150"],
    #zoom-200:checked ~ .toolbar label[for="zoom-200"] { border-color: var(--accent); background: #fff0e8; color: var(--accent); }
    #zoom-75:focus-visible ~ .toolbar label[for="zoom-75"],
    #zoom-100:focus-visible ~ .toolbar label[for="zoom-100"],
    #zoom-125:focus-visible ~ .toolbar label[for="zoom-125"],
    #zoom-150:focus-visible ~ .toolbar label[for="zoom-150"],
    #zoom-200:focus-visible ~ .toolbar label[for="zoom-200"] { outline: 2px solid var(--link); outline-offset: 2px; }
    footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(45,49,66,.12);
      color: var(--soft);
      font: 400 12px/1.6 'Geist Mono', monospace;
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Process · Linux Operations Mission</p>
    <h1>b1-1 설정부터 제출까지</h1>
    <p class="subtitle">Mac에서 Ubuntu 실습 환경을 준비한 뒤 보안과 권한을 구성하고, 아키텍처에 맞는 제공 앱을 실행해 관제 로그와 제출 증거를 만드는 흐름입니다.</p>

    <input class="zoom-toggle" type="radio" name="diagram-zoom" id="zoom-100" checked>
    <input class="zoom-toggle" type="radio" name="diagram-zoom" id="zoom-125">
    <input class="zoom-toggle" type="radio" name="diagram-zoom" id="zoom-150">
    <input class="zoom-toggle" type="radio" name="diagram-zoom" id="zoom-200">
    <div class="toolbar" role="radiogroup" aria-label="다이어그램 확대 및 축소 배율">

      <label for="zoom-125">125%</label>
      <label for="zoom-150">150%</label>
