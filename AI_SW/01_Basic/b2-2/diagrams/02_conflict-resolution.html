<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>확인된 충돌과 자동 병합 시나리오</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f5f5;color:#2d3142;font-family:'Geist','Noto Sans KR',system-ui,sans-serif}.frame{max-width:1080px;margin:auto}.eyebrow{font:500 8px 'Geist Mono',monospace;letter-spacing:.18em;color:#4f5d75;text-transform:uppercase}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:8px 0 20px}h1{min-width:0;margin:0;font:400 32px 'Instrument Serif','Noto Serif KR',serif}.tools{display:flex;flex:0 0 auto;gap:8px;align-items:center;flex-wrap:wrap}.tools a{padding:8px 12px;border:1px solid rgba(45,49,66,.25);border-radius:6px;background:#fff;color:#2d3142;text-decoration:none;font:500 12px 'Geist','Noto Sans KR',sans-serif}.tools a:hover,.tools a:focus{border-color:#eb6c36;outline:none}.viewport{height:min(72vh,712px);min-height:480px;overflow:auto;border-block:1px solid rgba(45,49,66,.12)}.zoom-target{display:none}svg{display:block;width:800px;height:712px;max-width:none;background:#f5f5f5}#cf-z50:target~svg{width:400px;height:356px}#cf-z100:target~svg{width:800px;height:712px}#cf-z150:target~svg{width:1200px;height:1068px}#cf-z200:target~svg{width:1600px;height:1424px}#cf-fit:target~svg{width:100%;height:auto}.name{font:600 12px 'Geist','Noto Sans KR',sans-serif;fill:#2d3142}.small-ko{font:500 12px 'Geist','Noto Sans KR',sans-serif;fill:#4f5d75}.tech{font:400 8px 'Geist Mono',monospace;fill:#7a8399}.legend{font:500 8px 'Geist Mono',monospace;fill:#4f5d75;letter-spacing:.08em}.note{margin-top:12px;color:#4f5d75;font-size:12px}@media(max-width:900px){.tools{flex-basis:100%;justify-content:flex-start}}@media(max-width:640px){body{padding:16px}.viewport{min-height:400px}}
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">FLOWCHART · DIAGRAM-DESIGN 2.6.12</p>
    <div class="head"><h1>확인된 충돌과 자동 병합 시나리오</h1><div class="tools" aria-label="다이어그램 확대 축소"><a href="#cf-z50">50%</a><a href="#cf-z100">100%</a><a href="#cf-z150">150%</a><a href="#cf-z200">200%</a><a href="#cf-fit">화면 맞춤</a></div></div>
    <div class="viewport">
      <span class="zoom-target" id="cf-z50"></span><span class="zoom-target" id="cf-z100"></span><span class="zoom-target" id="cf-z150"></span><span class="zoom-target" id="cf-z200"></span><span class="zoom-target" id="cf-fit"></span>
      <svg viewBox="0 0 800 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02_conflict-resolution-title 02_conflict-resolution-desc">
        <title id="02_conflict-resolution-title">확인된 충돌과 자동 병합 시나리오</title>
        <desc id="02_conflict-resolution-desc">main.py의 add/add 충돌은 부모 커밋 재실행으로 확인됐습니다. old-guide.md 이름 변경과 수정 시나리오는 부모 커밋 재실행에서 R100 자동 병합됐으며, 당시 conflict marker 증거는 확인되지 않았습니다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="800" height="712" fill="#f5f5f5"/>

        <!-- 연결선을 노드보다 먼저 그려 교차와 겹침을 피합니다. -->
        <line x1="400" y1="72" x2="400" y2="104" stroke="#4f5d75" marker-end="url(#arrow)"/>
        <line x1="400" y1="168" x2="400" y2="200" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="300" y1="248" x2="240" y2="248" stroke="#4f5d75" marker-end="url(#arrow)"/>
        <line x1="500" y1="248" x2="560" y2="248" stroke="#4f5d75" marker-end="url(#arrow)"/>
        <path d="M140 284V336H384Q392 336 392 344V356" fill="none" stroke="#4f5d75"/>
        <path d="M660 284V328H416Q408 328 408 336V356" fill="none" stroke="#4f5d75"/>
        <line x1="400" y1="364" x2="400" y2="400" stroke="#4f5d75" marker-end="url(#arrow)"/>
        <line x1="400" y1="464" x2="400" y2="496" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="400" y1="560" x2="400" y2="592" stroke="#2e5aa8" marker-end="url(#arrow-link)"/>

        <!-- 증거 수준 라벨은 선과 12px 간격을 둡니다. -->
        <rect x="238" y="220" width="58" height="16" rx="2" fill="#f5f5f5"/><text x="267" y="232" text-anchor="middle" class="small-ko">충돌 확인</text>
        <rect x="504" y="220" width="64" height="16" rx="2" fill="#f5f5f5"/><text x="536" y="232" text-anchor="middle" class="small-ko">자동 병합</text>

        <!-- 원격 이력과 부모 커밋 재실행 결과 -->
        <rect x="300" y="24" width="200" height="48" rx="24" fill="#fff" stroke="#2d3142"/><text x="400" y="52" text-anchor="middle" class="name">원격 이력과 부모 replay 확인</text>
        <rect x="300" y="104" width="200" height="64" rx="6" fill="#fff" stroke="rgba(45,49,66,.35)"/><text x="400" y="132" text-anchor="middle" class="name">부모·diff·commit 메시지 대조</text><text x="400" y="152" text-anchor="middle" class="tech">PARENTS · REPLAY · TREE DIFF</text>
        <polygon points="400,200 500,248 400,296 300,248" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="400" y="244" text-anchor="middle" class="name">재실행 결과는?</text><text x="400" y="264" text-anchor="middle" class="tech">CONFLICT OR AUTO-MERGE</text>
        <rect x="40" y="212" width="200" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.35)"/><text x="140" y="240" text-anchor="middle" class="name">main.py add/add 충돌</text><text x="140" y="260" text-anchor="middle" class="small-ko">#15 + #14 · 부모 replay 확인</text><text x="140" y="276" text-anchor="middle" class="tech">abe92b8 · CONFLICT VERIFIED</text>
        <rect x="560" y="212" width="200" height="72" rx="6" fill="#fff" stroke="rgba(45,49,66,.35)"/><text x="660" y="240" text-anchor="middle" class="name">rename/modify 자동 병합</text><text x="660" y="260" text-anchor="middle" class="small-ko">1b1ec20 + e660623 replay</text><text x="660" y="276" text-anchor="middle" class="tech">R100 · CONFLICT MARKER 없음</text>
        <circle cx="400" cy="360" r="4" fill="#2d3142"/>
        <rect x="300" y="400" width="200" height="64" rx="6" fill="#fff" stroke="#2d3142"/><text x="400" y="428" text-anchor="middle" class="name">문서상 해결 의도와 사실 분리</text><text x="400" y="448" text-anchor="middle" class="tech">fee0b98 메시지 ≠ 충돌 증명</text>
        <rect x="300" y="496" width="200" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="400" y="524" text-anchor="middle" class="name">부모 replay·diff·상태 검증</text><text x="400" y="544" text-anchor="middle" class="tech">git merge · git diff --cached</text>
        <rect x="300" y="592" width="200" height="48" rx="24" fill="rgba(46,90,168,.06)" stroke="#2e5aa8"/><text x="400" y="620" text-anchor="middle" class="name">확인됨과 미확인을 분리 기록</text>
        <line x1="32" y1="664" x2="768" y2="664" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
        <text x="32" y="688" class="legend">EVIDENCE</text><text x="116" y="688" class="small-ko">abe92b8 충돌 확인 · rename/modify는 자동 병합 · 당시 conflict marker 증거 없음</text>
      </svg>
    </div>
    <p class="note">상단 버튼으로 화면 맞춤·50%·100%·150%·200%를 선택하고, 확대 후 가로·세로 스크롤로 이동할 수 있습니다.</p>
  </main>
</body>
</html>
