<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>b6-2 AI Git 메시지 생성 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45, 49, 66, 0.12);
      --accent: #eb6c36;
      --link: #2e5aa8;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 32px 20px;
      border-bottom: 1px solid var(--rule);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font: 500 8px/1 'Geist Mono', monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 400 28px/1.05 'Instrument Serif', 'Noto Serif KR', serif;
    }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .zoom-label, .doc-link {
      min-height: 36px;
      border: 1px solid rgba(45, 49, 66, .24);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      font: 500 12px/1 'Geist', 'Noto Sans KR', sans-serif;
      text-decoration: none;
      cursor: pointer;
    }
    .zoom-label:hover, .doc-link:hover, .doc-link:focus-visible {
      border-color: var(--accent);
      outline: none;
    }
    .zoom-choice { position: fixed; inline-size: 1px; block-size: 1px; opacity: 0; pointer-events: none; }
    .zoom-choice:focus-visible + header .controls .zoom-label { outline: 2px solid var(--accent); }
    #viewport {
      height: calc(100vh - 144px);
      min-height: 420px;
      overflow: auto;
      cursor: grab;
      touch-action: pan-x pan-y;
      background: var(--paper);
    }
    .canvas { min-width: 840px; transition: width 160ms ease; }
    svg { display: block; width: 100%; height: auto; }
    #zoom-fit:checked ~ #viewport .canvas { width: 100%; }
    #zoom-100:checked ~ #viewport .canvas { width: 840px; }
    #zoom-150:checked ~ #viewport .canvas { width: 1260px; }
    #zoom-200:checked ~ #viewport .canvas { width: 1680px; }
    #zoom-fit:checked ~ header label[for="zoom-fit"],
    #zoom-100:checked ~ header label[for="zoom-100"],
    #zoom-150:checked ~ header label[for="zoom-150"],
    #zoom-200:checked ~ header label[for="zoom-200"] {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(235, 108, 54, .08);
    }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 32px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font: 400 12px/1.4 'Geist Mono', monospace;
    }
    @media (max-width: 760px) {
      header { align-items: start; flex-direction: column; padding: 20px; }
      #viewport { height: calc(100vh - 220px); }
      footer { padding: 12px 20px; flex-direction: column; }
    }
    @media print {
      header .controls, footer { display: none; }
      #viewport { height: auto; }
      svg { height: auto; }
    }
  </style>
</head>
