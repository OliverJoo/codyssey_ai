<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>b1-2 미션 흐름 다이어그램</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #07111f; color: #e5edf8; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1rem; background: #0d1b2d; border-bottom: 1px solid #29405e; }
    h1 { margin: 0; font-size: 1rem; }
    .controls { display: flex; align-items: center; gap: .5rem; }
    button { border: 1px solid #46688f; border-radius: .55rem; padding: .55rem .8rem; background: #15304e; color: white; cursor: pointer; }
    button:hover, button:focus-visible { background: #1e4a78; outline: 2px solid #65b8ff; }
    #scale { min-width: 4rem; text-align: center; font-variant-numeric: tabular-nums; }
    #viewport { height: calc(100vh - 62px); overflow: auto; cursor: grab; }
    #viewport.dragging { cursor: grabbing; user-select: none; }
    #canvas { width: max-content; min-width: 100%; min-height: 100%; display: grid; place-items: center; padding: 2rem; }
    #diagram { width: min(1100px, 90vw); height: auto; transform-origin: center; transition: transform 120ms ease; filter: drop-shadow(0 18px 40px #0008); }
    .hint { position: fixed; left: 1rem; bottom: 1rem; padding: .55rem .75rem; border-radius: .5rem; background: #06101ddd; color: #a9bad0; font-size: .82rem; }
  </style>
</head>
<body>
  <header>
    <h1>환경 준비 → 장애 재현 → 증거 → 리포트</h1>
    <div class="controls" aria-label="확대 축소 도구">
      <button type="button" id="zoomOut" aria-label="축소">−</button>
      <span id="scale" aria-live="polite">100%</span>
      <button type="button" id="zoomIn" aria-label="확대">+</button>
      <button type="button" id="reset">초기화</button>
    </div>
  </header>
  <main id="viewport">
    <div id="canvas"><img id="diagram" src="02_mission-flow.svg" alt="b1-2 Linux 장애 분석 미션 흐름"></div>
  </main>
  <div class="hint">버튼·마우스 휠·트랙패드로 확대/축소, 드래그로 이동</div>
  <script>
    const viewport = document.querySelector('#viewport');
    const diagram = document.querySelector('#diagram');
    const scaleText = document.querySelector('#scale');
    let scale = 1;
    const applyScale = (next) => {
      scale = Math.min(3, Math.max(.4, next));
      diagram.style.transform = `scale(${scale})`;
      scaleText.textContent = `${Math.round(scale * 100)}%`;
    };
    document.querySelector('#zoomIn').addEventListener('click', () => applyScale(scale + .15));
    document.querySelector('#zoomOut').addEventListener('click', () => applyScale(scale - .15));
    document.querySelector('#reset').addEventListener('click', () => { applyScale(1); viewport.scrollTo({ top: 0, left: 0, behavior: 'smooth' }); });
    viewport.addEventListener('wheel', (event) => {
      if (event.ctrlKey || event.metaKey || Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        applyScale(scale + (event.deltaY < 0 ? .1 : -.1));
      }
    }, { passive: false });
    let drag = null;
    viewport.addEventListener('pointerdown', (event) => {
      drag = { x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
      viewport.classList.add('dragging');
      viewport.setPointerCapture(event.pointerId);
    });
    viewport.addEventListener('pointermove', (event) => {
      if (!drag) return;
      viewport.scrollLeft = drag.left - (event.clientX - drag.x);
      viewport.scrollTop = drag.top - (event.clientY - drag.y);
    });
    viewport.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });
  </script>
</body>
</html>
